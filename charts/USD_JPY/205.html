.pbnav {
  position: fixed; top: 50%; transform: translateY(-50%); z-index: 99999;
  width: 46px; height: 96px; background: rgba(20,20,20,0.50);
  border: 1px solid rgba(255,255,255,0.25); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; transition: background 0.15s ease;
}
.pbnav:hover { background: rgba(20,20,20,0.88); }
.pbnav:disabled { opacity: 0.18; cursor: default; }
.pbnav-left  { left: 0;  border-left: none;  border-radius: 0 8px 8px 0; }
.pbnav-right { right: 0; border-right: none; border-radius: 8px 0 0 8px; }
.pbtri { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.pbtri-left  { border-right: 15px solid #ffffff; }
.pbtri-right { border-left: 15px solid #ffffff; }
.pbnav-cap { font: 600 11px/1 -apple-system, sans-serif; color: #e0e0e0; letter-spacing: 0.3px; }
/* チャート本体(固定幅)を画面中央に寄せる。画面が狭い時は margin auto が 0 になり破綻しない */
.plotly-graph-div { margin-left: auto !important; margin-right: auto !important; }
</style>
<button id="pbnav-prev" class="pbnav pbnav-left"  title="前へ #204">
  <span class="pbtri pbtri-left"></span><span class="pbnav-cap">#204</span>
</button>
<button id="pbnav-next" class="pbnav pbnav-right"  title="次へ #206">
  <span class="pbtri pbtri-right"></span><span class="pbnav-cap">#206</span>
</button>
<script>
(function() {
  var prevUrl = "../USD_JPY/204.html";
  var nextUrl = "../USD_JPY/206.html";
  // クリックで前後ページへ (onclick属性のクォート衝突を避けるため addEventListener を使う)
  var pb = document.getElementById('pbnav-prev');
  var nb = document.getElementById('pbnav-next');
  if (pb && prevUrl) { pb.addEventListener('click', function() { location.href = prevUrl; }); }
  if (nb && nextUrl) { nb.addEventListener('click', function() { location.href = nextUrl; }); }
  // キーボードの左右キーでも移動
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft'  && prevUrl) { location.href = prevUrl; }
    if (e.key === 'ArrowRight' && nextUrl) { location.href = nextUrl; }
  });
})();
</script>
<!--PBNAV-END--></body>
</html>
