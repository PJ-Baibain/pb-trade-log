.pbnav:hover { background: rgba(20,20,20,0.88); }

.pbnav-left  { left: 0;  border-left: none;  border-radius: 0 8px 8px 0; }

.pbtri { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.pbtri-left  { border-right: 15px solid #ffffff; }

.pbnav-cap { font: 600 11px/1 -apple-system, sans-serif; color: #e0e0e0; letter-spacing: 0.3px; }

.plotly-graph-div { margin-left: auto !important; margin-right: auto !important; }

<button id="pbnav-prev" class="pbnav pbnav-left"  title="前へ #117">

</button>
<button id="pbnav-next" class="pbnav pbnav-right"  title="次へ #119">

<script>
(function() {
  var prevUrl = "../EUR_USD/117.html";
  var nextUrl = "../USD_JPY/119.html";
  // クリックで前後ページへ (onclick属性のクォート衝突を避けるため addEventListener を使う)
  var pb = document.getElementById('pbnav-prev');
  var nb = document.getElementById('pbnav-next');
  if (pb && prevUrl) { pb.addEventListener('click', function() { location.href = prevUrl; }); }
  if (nb && nextUrl) { nb.addEventListener('click', function() { location.href = nextUrl; }); }
