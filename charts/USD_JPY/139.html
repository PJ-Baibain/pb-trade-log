<button id="pbnav-prev" class="pbnav pbnav-left"  title="前へ #138">
  <span class="pbtri pbtri-left"></span><span class="pbnav-cap">#138</span>
</button>
<button id="pbnav-next" class="pbnav pbnav-right"  title="次へ #140">
  <span class="pbtri pbtri-right"></span><span class="pbnav-cap">#140</span>
</button>
<script>
(function() {
  var prevUrl = "../USD_JPY/138.html";
  var nextUrl = "../EUR_USD/140.html";
  // クリックで前後ページへ (onclick属性のクォート衝突を避けるため addEventListener を使う)
  var pb = document.getElementById('pbnav-prev');
  var nb = document.getElementById('pbnav-next');
  if (pb && prevUrl) { pb.addEventListener('click', function() { location.href = prevUrl; }); }
  if (nb && nextUrl) { nb.addEventListener('click', function() { location.href = nextUrl; }); }
  // キーボードの左右キーでも移動
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft'  && prevUrl) { location.href = prevUrl; }
    if (e.key === 'ArrowRight' && nextUrl) { location.href = nextUrl; }
  });
})();
</script>
