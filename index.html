<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Algo trade logs - model: Dorami</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.0/plotly.min.js"></script>
<style>
  /* デフォルト = 個人モード (白基調) */
  :root {
    --bg: #ffffff;
    --panel: #f5f7fa;
    --panel2: #eceff4;
    --text: #1a2638;
    --muted: #6b7785;
    --accent: #2a2a2a;          /* ダークグレー (ボタン active 背景) */
    --accent-text: #ffffff;     /* 暗背景上は白文字 */
    --title: #1a1a1a;           /* タイトル: 黒 */
    --link: #1565c0;            /* リンク: royal blue */
    --pos: #43a047;             /* 標準的な緑 (Material Green 600) */
    --neg: #ff1744;             /* 鮮やかな赤 */
    --border: #d8e0e8;
  }
  /* 法人モード = すごく薄い青基調 */
  body.mode-corporate {
    --bg: #eaf3fa;
    --panel: #ffffff;
    --panel2: #e3f0f9;
    --text: #0d2538;
    --muted: #5d6e83;
    --accent: #37474f;          /* 法人モードは ほんの少し青み のダークグレー */
    --accent-text: #ffffff;
    --title: #0d2538;           /* タイトル: ほぼ黒 (法人テキストと統一) */
    --link: #0d47a1;
    --pos: #43a047;
    --neg: #ff1744;
    --border: #cfd8dc;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100vw; overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { color: var(--title); margin: 0 0 4px 0; font-size: 22px; font-weight: 700; }
  .header-logo { height: 40px; width: auto; display: block; margin: 0 0 6px 0; }
  .last-update { color: var(--muted); font-size: 12px; margin-bottom: 16px; }

  /* ヘッダー (タイトル + モードトグル) */
  .header-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    margin-bottom: 4px; flex-wrap: wrap;
  }
  .mode-toggle {
    display: inline-flex; background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px; gap: 0;
  }
  .mode-toggle button {
    background: transparent; color: var(--muted); border: none;
    padding: 6px 16px; cursor: pointer; border-radius: 4px;
    font-size: 13px; font-weight: 500;
  }
  .mode-toggle button.active { background: var(--accent); color: var(--accent-text); font-weight: 700; }
  .mode-toggle .sub { font-size: 10px; opacity: 0.7; display: block; margin-top: 1px; }

  /* サマリーカード */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--panel); border-radius: 8px; padding: 12px;
    border: 1px solid var(--border);
  }
  .card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .card .value { font-size: 18px; font-weight: 600; }
  .card .value.pos { color: var(--pos); }
  .card .value.neg { color: var(--neg); }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* グラフ */
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 720px) {
    .charts { grid-template-columns: 1fr; }
  }
  .chart-wrap {
    background: var(--panel); border-radius: 8px; padding: 8px;
    border: 1px solid var(--border);
  }
  .chart-wrap h3 { margin: 4px 8px; font-size: 13px; color: var(--muted); font-weight: 500;
                    display: flex; justify-content: space-between; align-items: center; }
  .chart-wrap h3 .reset-btn {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    padding: 2px 8px; cursor: pointer; border-radius: 3px; font-size: 11px;
  }
  .chart-wrap h3 .reset-btn:hover { background: var(--accent); color: var(--accent-text); }
  .chart-box { height: 260px; }

  /* フィルター */
  .filters {
    background: var(--panel); padding: 12px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  }
  .filter-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .filter-group .label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .filter-group button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; cursor: pointer; border-radius: 4px; font-size: 12px;
  }
  .filter-group button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .filter-group input[type="date"] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 4px; font-size: 12px; color-scheme: dark;
  }
  .download-btn {
    background: var(--accent) !important; color: var(--accent-text) !important;
    border: 1px solid var(--accent) !important; font-weight: 700 !important;
  }
  .download-btn:hover { opacity: 0.85; }

  /* フィルター結果サマリー */
  .filtered-summary {
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    background: var(--panel); padding: 10px 14px; border-radius: 6px;
    border: 1px solid var(--border); margin-bottom: 8px;
    font-size: 13px;
  }
  .filtered-summary .label-tag {
    color: var(--accent); font-weight: 600; padding-right: 6px;
    border-right: 1px solid var(--border); margin-right: 4px;
  }
  .filtered-summary .stat { color: var(--muted); }
  .filtered-summary .stat b { color: var(--text); margin-left: 4px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .filtered-summary .stat b.pos { color: var(--pos); }
  .filtered-summary .stat b.neg { color: var(--neg); }

  /* テーブル */
  .table-wrap {
    background: var(--panel); border-radius: 8px; overflow-x: auto;
    border: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td {
    padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border); white-space: nowrap;
  }
  th:last-child, td:last-child { border-right: none; }
  th {
    background: var(--panel2); color: var(--muted); font-weight: 500;
    position: sticky; top: 0; cursor: pointer; user-select: none;
  }
  th:hover { background: var(--panel2); color: var(--title); }
  th .arrow { display: inline-block; margin-left: 4px; opacity: 0.4; font-size: 10px; }
  th.sorted .arrow { opacity: 1; color: var(--title); }
  tbody tr:hover { background: rgba(77, 208, 225, 0.05); }
  td.pos { color: var(--pos); font-weight: 600; }
  td.neg { color: var(--neg); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--link); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .count-info { color: var(--muted); font-size: 11px; padding: 8px; }

  /* ===== ログイン画面 ===== */
  #login-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff; display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .login-card {
    background: #ffffff; padding: 40px 48px; border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08); border: 1px solid #e0e0e0;
    width: 320px; max-width: 90%;
  }
  .login-card h2 {
    margin: 0 0 24px 0; color: #000000; font-size: 18px; text-align: center;
  }
  .login-card label {
    display: block; font-size: 12px; color: #666; margin: 12px 0 4px 0;
  }
  .login-card input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid #d0d0d0; border-radius: 4px; box-sizing: border-box;
    outline: none;
  }
  .login-card input:focus { border-color: #000; }
  .login-card button {
    width: 100%; padding: 12px; margin-top: 20px;
    background: #1a1a1a; color: #ffffff; border: none; border-radius: 4px;
    font-size: 14px; cursor: pointer;
  }
  .login-card button:hover { background: #333; }
  #login-error {
    color: #ff1744; font-size: 12px; margin-top: 12px; text-align: center;
    min-height: 16px;
  }
  .logout-link {
    color: #666; font-size: 11px; text-decoration: none; margin-left: 16px;
    cursor: pointer; align-self: center;
  }
  .logout-link:hover { color: #1a1a1a; text-decoration: underline; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>

/* ===================== BLUE / COOL DARK THEME ===================== */
:root{
  --bg: transparent;
  --panel: rgba(255,255,255,0.05);
  --panel2: rgba(255,255,255,0.08);
  --text: #d8e6f7;
  --muted: #8099bd;
  --accent: #3e8bff;
  --accent-text: #ffffff;
  --title: #eaf3ff;
  --link: #5ac8ff;
  --pos: #35e0a1;
  --neg: #ff6384;
  --border: rgba(120,170,255,0.16);
}
html,body{ background:#07182c; }
body{
  font-family:'Manrope','Noto Sans JP',-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  color:var(--text);
  min-height:100vh;
  padding:0;
  position:relative;
  -webkit-text-size-adjust:100%;
}
/* 背景: 固定のネイビーグラデ + 青いグロー (iOS対策で ::before に固定) */
body::before{
  content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(1200px 720px at 8% -12%, rgba(46,110,196,0.45), transparent 60%),
    radial-gradient(1100px 820px at 112% 6%, rgba(24,150,205,0.32), transparent 55%),
    radial-gradient(1000px 900px at 50% 122%, rgba(66,86,210,0.30), transparent 55%),
    linear-gradient(158deg, #06162a 0%, #0a2140 46%, #071a30 100%);
}
/* 薄いドットグリッド (テック感) */
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.55;
  background-image: radial-gradient(rgba(150,190,255,0.05) 1px, transparent 1px);
  background-size: 42px 42px;
  -webkit-mask-image: radial-gradient(circle at 50% 26%, #000 26%, transparent 76%);
          mask-image: radial-gradient(circle at 50% 26%, #000 26%, transparent 76%);
}

/* 本番(ログイン付き)で法人モードに切替えてもダークを維持 (元CSSの薄青varを上書き) */
body.mode-corporate{
  --bg: transparent; --panel: rgba(255,255,255,0.05); --panel2: rgba(255,255,255,0.08);
  --text:#d8e6f7; --muted:#8099bd; --accent:#3e8bff; --accent-text:#ffffff;
  --title:#eaf3ff; --link:#5ac8ff; --pos:#35e0a1; --neg:#ff6384; --border:rgba(120,170,255,0.16);
}
/* ログイン画面(本番のみ表示)もダークテーマに */
#login-screen{ background:#07182c !important; }
.login-card{
  background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)) !important;
  border:1px solid var(--border) !important;
  box-shadow:0 24px 70px rgba(0,0,0,0.55) !important;
}
.login-card h2{ color:var(--title) !important; font-family:'Space Grotesk',sans-serif; }
.login-card label{ color:var(--muted) !important; }
.login-card input{
  background:rgba(255,255,255,0.06) !important; border:1px solid var(--border) !important;
  color:var(--text) !important;
}
.login-card input:focus{ border-color:var(--accent) !important; }
.login-card button{
  background:linear-gradient(180deg,#4d97ff,#2f6fe0) !important; color:#fff !important;
}
.login-card button:hover{ filter:brightness(1.08); background:linear-gradient(180deg,#4d97ff,#2f6fe0) !important; }
.logout-link{ color:var(--muted) !important; }
.logout-link:hover{ color:var(--title) !important; }

#app{
  position:relative; z-index:1;
  max-width:1760px; margin:0 auto;   /* ワイド画面の左右余白を縮小(枠いっぱいにはしない) */
  padding:30px 30px 60px;
}
::selection{ background:rgba(62,139,255,0.35); color:#fff; }

/* ---- トップバー / ヒーロー ---- */
.header-row{
  align-items:center;
  padding:4px 2px 2px; margin-bottom:22px;
  background:none; border:none; border-radius:0; box-shadow:none;
}
.header-logo{
  height:54px !important;
  /* 点滅なし・静止の うっすらネオン */
  filter:
    drop-shadow(0 0 5px rgba(120,215,255,0.42))
    drop-shadow(0 0 13px rgba(60,165,255,0.32))
    drop-shadow(0 0 24px rgba(48,120,230,0.20))
    drop-shadow(0 3px 8px rgba(0,0,0,0.42));
}
.last-update{ color:var(--muted); font-size:12px; margin:8px 0 0 2px; letter-spacing:.02em; }

.mode-toggle{
  background:rgba(255,255,255,0.04); border:1px solid var(--border);
  border-radius:12px; padding:4px;
}
.mode-toggle button{ border-radius:9px; color:var(--muted); }
.mode-toggle button.active{
  background:linear-gradient(180deg,#4d97ff,#2f6fe0);
  color:#fff; box-shadow:0 4px 16px rgba(46,110,220,0.5);
}
h1{ font-family:'Space Grotesk',sans-serif; color:var(--title); }

/* ---- サマリーカード ---- */
.summary-grid{ grid-template-columns:repeat(auto-fit,minmax(156px,1fr)); gap:14px; margin-bottom:24px; }
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.065), rgba(255,255,255,0.022));
  border:1px solid var(--border); border-radius:16px; padding:16px 16px 15px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(0,10,30,0.30), inset 0 1px 0 rgba(255,255,255,0.06);
  position:relative; overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card::before{
  content:''; position:absolute; top:0; left:14px; right:14px; height:2px;
  background:linear-gradient(90deg, transparent, rgba(90,200,255,0.9), transparent); opacity:.6;
}
.card:hover{
  transform:translateY(-3px); border-color:rgba(120,185,255,0.42);
  box-shadow:0 16px 42px rgba(0,20,60,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
}
.card .label{ text-transform:uppercase; letter-spacing:.08em; font-size:10px; color:var(--muted); }
.card .value{
  font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600;
  letter-spacing:-0.5px; color:var(--title); margin-top:3px;
  white-space:nowrap;   /* "-¥1,483,004" がハイフンで折り返さないように */
  /* 中立の数値(勝率/PF/Sharpe)= シアン系ネオンで もわっと発光 */
  text-shadow:0 0 8px rgba(96,200,255,0.55), 0 0 24px rgba(60,160,255,0.35);
}
.card .value.pos{ color:var(--pos);
  text-shadow:0 0 8px rgba(53,224,161,0.60), 0 0 26px rgba(53,224,161,0.42); }
.card .value.neg{ color:var(--neg);
  text-shadow:0 0 8px rgba(255,99,132,0.55), 0 0 26px rgba(255,99,132,0.40); }
.card .sub{ color:var(--muted); }

/* ---- グラフ ---- */
.charts{ gap:16px; margin-bottom:24px; }
.chart-wrap{
  background:linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
  border:1px solid var(--border); border-radius:16px; padding:12px 12px 6px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(0,10,30,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
}
.chart-wrap h3{
  color:var(--muted); font-family:'Space Grotesk',sans-serif;
  letter-spacing:.04em; text-transform:uppercase; font-size:12px;
}
.chart-wrap h3 .reset-btn{
  background:rgba(255,255,255,0.05); color:var(--muted);
  border:1px solid var(--border); border-radius:7px;
}
.chart-wrap h3 .reset-btn:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
/* ネオン発光する折れ線 (Plotlyのjs-lineパスにグロー) — 暗闇に光るネオン管風 */
#equity-chart .js-line{
  filter:
    drop-shadow(0 0 3px rgba(56,225,255,0.95))
    drop-shadow(0 0 8px rgba(56,225,255,0.70))
    drop-shadow(0 0 17px rgba(56,225,255,0.45));
}
#pips-chart .js-line{
  filter:
    drop-shadow(0 0 3px rgba(167,139,250,0.95))
    drop-shadow(0 0 8px rgba(167,139,250,0.70))
    drop-shadow(0 0 17px rgba(167,139,250,0.45));
}

/* ---- フィルター ---- */
.filters{
  background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border:1px solid var(--border); border-radius:14px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  gap:10px 18px;
}
.filter-group .label{ text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--muted); }
.filter-group button{
  background:rgba(255,255,255,0.05); color:var(--text);
  border:1px solid var(--border); border-radius:999px; padding:5px 13px;
  transition:all .18s ease;
}
.filter-group button:hover{ border-color:rgba(120,185,255,0.55); color:#fff; }
.filter-group button.active{
  background:linear-gradient(180deg,#4d97ff,#2f6fe0); color:#fff;
  border-color:transparent; box-shadow:0 4px 14px rgba(46,110,220,0.45);
}
.filter-group input[type="date"]{
  background:rgba(255,255,255,0.05); border:1px solid var(--border);
  border-radius:8px; color:var(--text);
}
.download-btn{
  background:linear-gradient(180deg,#4d97ff,#2f6fe0) !important; color:#fff !important;
  border:1px solid transparent !important; border-radius:999px !important;
  box-shadow:0 4px 16px rgba(46,110,220,0.5);
}

/* ---- フィルター結果サマリー ---- */
.filtered-summary{
  background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border:1px solid var(--border); border-radius:12px;
}
.filtered-summary .label-tag{ color:#5ac8ff; border-right-color:var(--border); }
.filtered-summary .stat{ color:var(--muted); }
.filtered-summary .stat b{ color:var(--title); }

/* ---- テーブル ---- */
.table-wrap{
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.018));
  border:1px solid var(--border); border-radius:16px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 28px rgba(0,10,30,0.28);
}
table{ font-family:'Manrope','Noto Sans JP',sans-serif; }
th{
  background:rgba(15,38,68,0.92) !important; color:var(--muted) !important;
  text-transform:uppercase; letter-spacing:.04em; font-size:11px;
  border-bottom:1px solid var(--border);
}
th:hover{ color:var(--title) !important; }
td{
  border-bottom:1px solid rgba(120,170,255,0.09);
  border-right:1px solid rgba(120,170,255,0.06);
}
tbody tr{ transition:background .15s ease; }
tbody tr:hover{ background:rgba(62,139,255,0.10) !important; }
td.pos{ color:var(--pos); } td.neg{ color:var(--neg); }
/* 方向バッジ: LONG=緑▲ / SHORT=赤▼ (絵文字非依存で確実に表示) */
.dir-badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 10px; border-radius:999px;
  font-weight:700; font-size:11px; letter-spacing:.03em;
}
.dir-badge .tri{ font-size:9px; line-height:1; }
.dir-badge.long{ color:var(--pos); background:rgba(53,224,161,0.12); border:1px solid rgba(53,224,161,0.32); }
.dir-badge.short{ color:var(--neg); background:rgba(255,99,132,0.12); border:1px solid rgba(255,99,132,0.32); }
a{ color:var(--link); }
a:hover{ color:#8fdcff; }
.count-info{ color:var(--muted); }

/* ---- スクロールバー ---- */
::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-thumb{ background:rgba(120,170,255,0.25); border-radius:20px; }
::-webkit-scrollbar-thumb:hover{ background:rgba(120,170,255,0.4); }
::-webkit-scrollbar-track{ background:transparent; }

/* ---- モバイル ---- */
@media (max-width:640px){
  #app{ padding:18px 14px 42px; }
  .header-row{ padding:2px 0 0; gap:10px; }

<body class="mode-personal">

<!-- ===== ログイン画面 (デフォルト表示) ===== -->
<div id="login-screen">
  <form class="login-card" id="login-form">
    <h2>Algo trade logs</h2>
    <label for="login-id">ID</label>
    <input type="text" id="login-id" autocomplete="username" autofocus>
    <label for="login-pw">Password</label>
    <input type="password" id="login-pw" autocomplete="current-password">
    <button type="submit">ログイン</button>
    <div id="login-error"></div>
  </form>
</div>

<!-- ===== メインコンテンツ (login-screen が z-index:9999 で覆うので 初期から visible) ===== -->
<div id="app">

<div class="header-row">
  <div>
    <img src="header_logo_public.png" alt="baibain" class="header-logo">
    <div class="last-update">最終更新: 2026-07-14 22:30:08 JST &nbsp;|&nbsp; 期間: 2025-11-03 〜 現在</div>
  </div>
  <div class="mode-toggle">
    <button class="active" data-mode="personal">個人<span class="sub">¥5M / 4%</span></button>
    <button data-mode="corporate">法人<span class="sub">¥10M / 4%</span></button>
    <a class="logout-link" onclick="doLogout()">ログアウト</a>
  </div>
</div>

<!-- サマリーカード (JSで動的更新) -->
<div class="summary-grid" id="summary-grid"></div>

<!-- グラフ -->
<div class="charts">
  <div class="chart-wrap">
    <h3>資金推移 <button class="reset-btn" onclick="resetChart('equity-chart')">↻ リセット</button></h3>
    <div id="equity-chart" class="chart-box"></div>
  </div>
  <div class="chart-wrap">
    <h3>累積 pips <button class="reset-btn" onclick="resetChart('pips-chart')">↻ リセット</button></h3>
    <div id="pips-chart" class="chart-box"></div>
  </div>
</div>

<!-- フィルター -->
<div class="filters">
  <div class="filter-group">
    <span class="label">ペア:</span>
    <button class="active" data-filter="symbol" data-value="all">全て</button>
    <button data-filter="symbol" data-value="USD_JPY">USD_JPY</button>
    <button data-filter="symbol" data-value="EUR_JPY">EUR_JPY</button>
    <button data-filter="symbol" data-value="EUR_USD">EUR_USD</button>
  </div>
  <div class="filter-group">
    <span class="label">結果:</span>
    <button class="active" data-filter="result" data-value="all">全て</button>
    <button data-filter="result" data-value="win">勝ち</button>
    <button data-filter="result" data-value="loss">負け</button>
  </div>
  <div class="filter-group">
    <span class="label">件数:</span>
    <button data-filter="limit" data-value="20">20</button>
    <button data-filter="limit" data-value="50">50</button>
    <button data-filter="limit" data-value="100">100</button>
    <button class="active" data-filter="limit" data-value="all">All</button>
  </div>
  <div class="filter-group">
    <span class="label">期間:</span>
    <input type="date" id="date-from"> 〜 <input type="date" id="date-to">
    <button id="date-clear">クリア</button>
    <button data-quick="today">本日</button>
    <button data-quick="week">今週</button>
    <button data-quick="month">今月</button>
    <button data-quick="all">All</button>
  </div>
  <div class="filter-group" style="margin-left: auto;">
    <button class="download-btn" onclick="downloadCsv()">CSV ダウンロード</button>
  </div>
</div>

<!-- フィルター結果サマリー -->
<div class="filtered-summary" id="filtered-summary"></div>

<!-- テーブル -->
<div class="table-wrap">

  </table>

</div>

// --- 年率 Sharpe Ratio 計算 (日次リターン × √252) ---
// 日次リサンプル: equity.csv の timestamp から日付ごとに最後の cap を取る
// → 日次リターン (cap_today - cap_yesterday) / cap_yesterday
// → mean / std * sqrt(252)
function calcSharpeAnnualized(mode) {
  const capKey = mode === 'personal' ? 'capital_personal' : 'capital_corporate';
  if (!EQUITY || EQUITY.length < 3) return null;
  const dailyMap = {};
  for (const e of EQUITY) {
    const day = e.timestamp.slice(0, 10);
    dailyMap[day] = e[capKey];  // 同日内は最後の値で上書き
  }
  const days = Object.keys(dailyMap).sort();
  if (days.length < 3) return null;
  const returns = [];
  for (let i = 1; i < days.length; i++) {
    const prev = dailyMap[days[i - 1]];
    const cur = dailyMap[days[i]];
    if (prev > 0) returns.push((cur - prev) / prev);
  }
  if (returns.length < 2) return null;
  const mean = returns.reduce((a, b) => a + b, 0) / returns.length;
  const variance = returns.reduce((a, b) => a + (b - mean) ** 2, 0) / (returns.length - 1);
  const std = Math.sqrt(variance);
  if (std <= 0) return null;
  return (mean / std) * Math.sqrt(252);
}

// --- CSV ダウンロード (現在のフィルター適用後の表示中rowsを出力) ---
function downloadCsv() {
  if (currentRows.length === 0) { alert('ダウンロードするデータがありません'); return; }
  const cols = Object.keys(currentRows[0]);
  const lines = [cols.join(',')];
  for (const r of currentRows) {
    lines.push(cols.map(c => {
      const v = r[c];
      if (v === null || v === undefined) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(','));
  }
  // BOM付き UTF-8 (Excel で文字化け防止)
  const blob = new Blob(['\ufeff' + lines.join('\n')], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  a.download = 'pb_trade_log_' + ts + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- フィルター状態 + ソート状態 ---
const filters = { symbol: 'all', result: 'all', limit: 'all', dateFrom: '', dateTo: '' };
let sortCol = 'entry_time';  // デフォルト: エントリー時刻
let sortDir = 'desc';        // デフォルト: 新しい順
let sortType = 'date';
let currentRows = [];        // 表示中の rows (CSV ダウンロード用)

// --- グラフ描画 ---
// --- チャート テーマ (モード別) ---
const CHART_THEMES = {
  personal: {
    paper: 'rgba(0,0,0,0)', plot: 'rgba(0,0,0,0)', text: '#9cb8d8', grid: 'rgba(130,175,255,0.12)',
    eqLine: '#38e1ff', pipsLine: '#a78bfa', baseline: 'rgba(160,190,230,0.45)',
  },
  corporate: {
    paper: 'rgba(0,0,0,0)', plot: 'rgba(0,0,0,0)', text: '#9cb8d8', grid: 'rgba(130,175,255,0.12)',
    eqLine: '#38e1ff', pipsLine: '#a78bfa', baseline: 'rgba(160,190,230,0.45)',
  },
};

function drawEquityChart() {
  const t = CHART_THEMES[currentMode];
  const capKey = MODE_KEYS[currentMode].cap;
  const initCap = SUMMARY[currentMode].initial_capital;
  const x = EQUITY.map(r => r.timestamp);
  const y = EQUITY.map(r => r[capKey]);
  const trace = {
    x: x, y: y, mode: 'lines', name: '資金',
    line: {color: t.eqLine, width: 2},
    hovertemplate: '%{x}<br>¥%{y:,.0f}<extra></extra>'
  };
  const layout = {
    paper_bgcolor: t.paper, plot_bgcolor: t.plot,
    font: {color: t.text, size: 11},
    margin: {l: 46, r: 14, t: 10, b: 40},
    xaxis: {gridcolor: t.grid, showgrid: true},
    yaxis: {gridcolor: t.grid, tickformat: '~s', showgrid: true},
    shapes: [{type: 'line', xref: 'paper', x0: 0, x1: 1, y0: initCap, y1: initCap,
              line: {color: t.baseline, width: 1, dash: 'dash'}}],
  };
  Plotly.newPlot('equity-chart', [trace], layout, {responsive: true, displayModeBar: false});
}

function drawPipsChart() {
  const t = CHART_THEMES[currentMode];
  const sorted = [...TRADES].sort((a,b) => new Date(a.exit_time) - new Date(b.exit_time));
  let cum = 0;
  const x = []; const y = [];
  for (const tr of sorted) { cum += tr.pips; x.push(tr.exit_time); y.push(cum); }
  const trace = {
    x: x, y: y, mode: 'lines', name: '累積pips',
    line: {color: t.pipsLine, width: 2},
    hovertemplate: '%{x}<br>%{y:+.1f} pips<extra></extra>'
  };
  const layout = {
    paper_bgcolor: t.paper, plot_bgcolor: t.plot,
    font: {color: t.text, size: 11},
    margin: {l: 40, r: 14, t: 10, b: 40},
    xaxis: {gridcolor: t.grid},
    yaxis: {gridcolor: t.grid, tickformat: '~s'},
  };
  Plotly.newPlot('pips-chart', [trace], layout, {responsive: true, displayModeBar: false});
}

// --- テーブル描画 ---
function renderTable() {
  let rows = [...TRADES];
  // フィルター
  if (filters.symbol !== 'all') rows = rows.filter(r => r.symbol === filters.symbol);
  if (filters.result === 'win') rows = rows.filter(r => r.pips > 0);
  else if (filters.result === 'loss') rows = rows.filter(r => r.pips <= 0);
  if (filters.dateFrom) rows = rows.filter(r => r.entry_time.substring(0,10) >= filters.dateFrom);
  if (filters.dateTo) rows = rows.filter(r => r.entry_time.substring(0,10) <= filters.dateTo);
  // 並び替え (ヘッダークリックで指定された列、 モード依存列は currentMode に応じてキー解決)
  const mk = MODE_KEYS[currentMode];
  const colMap = { lot: mk.lot, pnl_yen: mk.pnl, capital_after: mk.cap_after };
  const sortKey = colMap[sortCol] || sortCol;
  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    let cmp;
    if (sortType === 'num') { cmp = av - bv; }
    else if (sortType === 'date') { cmp = new Date(av) - new Date(bv); }
    else { cmp = String(av).localeCompare(String(bv)); }
    return sortDir === 'desc' ? -cmp : cmp;
  });
  const totalCount = rows.length;
  // 件数制限
  if (filters.limit !== 'all') rows = rows.slice(0, parseInt(filters.limit));

  // CSV ダウンロード用に保存
  currentRows = rows;

  const tbody = document.getElementById('trade-tbody');
  tbody.innerHTML = rows.map(r => {
    const pipsCls = r.pips > 0 ? 'pos' : (r.pips < 0 ? 'neg' : '');
    const pnlVal = r[mk.pnl];
    const lotVal = r[mk.lot];
    const capVal = r[mk.cap_after];
    const pnlCls = pnlVal > 0 ? 'pos' : (pnlVal < 0 ? 'neg' : '');
    const pnlStr = pnlVal >= 0 ? `+¥${pnlVal.toLocaleString()}` : `-¥${Math.abs(pnlVal).toLocaleString()}`;
    const dir = r.direction === 'LONG' ? '<span class="dir-badge long"><span class="tri">▲</span>LONG</span>' : '<span class="dir-badge short"><span class="tri">▼</span>SHORT</span>';
    const chartPath = `charts/${r.symbol}/${String(r.trade_id).padStart(3,'0')}.html`;
    return `<tr>
      <td><a href="${chartPath}" target="_blank">#${String(r.trade_id).padStart(3,'0')}</a></td>
      <td>${r.symbol}</td>
      <td>${r.entry_time}</td>
      <td>${dir}</td>
      <td class="num ${pipsCls}">${r.pips > 0 ? '+' : ''}${r.pips.toFixed(1)}</td>
      <td class="num ${pnlCls}">${pnlStr}</td>
      <td class="num">${lotVal.toFixed(2)}</td>
      <td class="num">¥${capVal.toLocaleString()}</td>
      <td>${r.nanpin_count}</td>
      <td>${r.exit_reason}</td>
      <td class="num">${r.holding_hours.toFixed(1)}</td>
    </tr>`;
  }).join('');

  document.getElementById('count-info').textContent =
    `表示: ${rows.length} 件 / 全 ${totalCount} 件中` +
    (filters.limit !== 'all' && totalCount > parseInt(filters.limit) ? ` (上位 ${filters.limit} 件)` : '');

  // フィルター結果サマリー更新
  updateFilteredSummary(rows);
}

// --- フィルター結果サマリーの計算 + 表示 (モード対応) ---
function updateFilteredSummary(rows) {
  const el = document.getElementById('filtered-summary');
  if (rows.length === 0) {
    el.innerHTML = '<span class="label-tag">フィルター結果</span><span class="stat">該当なし</span>';
    return;
  }
  const pnlKey = MODE_KEYS[currentMode].pnl;
  const wins = rows.filter(r => r.pips > 0);
  const losses = rows.filter(r => r.pips <= 0);
  const totalPips = rows.reduce((s, r) => s + r.pips, 0);
  const totalPnl = rows.reduce((s, r) => s + r[pnlKey], 0);
  const grossWin = wins.reduce((s, r) => s + r.pips, 0);
  const grossLoss = Math.abs(losses.reduce((s, r) => s + r.pips, 0));
  const pf = grossLoss > 0 ? (grossWin / grossLoss).toFixed(2) : '∞';
  const winRate = (wins.length / rows.length * 100).toFixed(1);
  const pipsCls = totalPips > 0 ? 'pos' : (totalPips < 0 ? 'neg' : '');
  const pnlCls = totalPnl > 0 ? 'pos' : (totalPnl < 0 ? 'neg' : '');
  const pnlStr = totalPnl >= 0 ? '+¥' + totalPnl.toLocaleString() : '-¥' + Math.abs(totalPnl).toLocaleString();
  el.innerHTML =
    '<span class="label-tag">フィルター結果</span>' +
    '<span class="stat">N:<b>' + rows.length + '</b></span>' +
    '<span class="stat">勝率:<b>' + winRate + '%</b></span>' +
    '<span class="stat">PF:<b>' + pf + '</b></span>' +
    '<span class="stat">合計pips:<b class="' + pipsCls + '">' + (totalPips>0?'+':'') + totalPips.toFixed(1) + '</b></span>' +
    '<span class="stat">損益(円):<b class="' + pnlCls + '">' + pnlStr + '</b></span>';
}

// --- フィルターボタンの動作 ---
document.querySelectorAll('.filter-group button[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter; const v = btn.dataset.value;
    filters[f] = v;
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  });
});

// --- ヘッダークリック (ソート) ---
function updateSortArrows() {
  document.querySelectorAll('th[data-sort]').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.sort === sortCol) {
      th.classList.add('sorted');
      arrow.textContent = sortDir === 'desc' ? '↓' : '↑';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '↕';
    }
  });
}
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) {
      sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    } else {
      sortCol = col;
      sortType = th.dataset.type;
      sortDir = 'desc';  // 新しい列は default desc
    }
    updateSortArrows();
    renderTable();
  });
});
document.getElementById('date-from').addEventListener('change', e => { filters.dateFrom = e.target.value; renderTable(); });
document.getElementById('date-to').addEventListener('change', e => { filters.dateTo = e.target.value; renderTable(); });
document.getElementById('date-clear').addEventListener('click', () => {
  filters.dateFrom = ''; filters.dateTo = '';
  document.getElementById('date-from').value = ''; document.getElementById('date-to').value = '';
  renderTable();
});

// --- クイック期間ボタン (本日/今週/今月/All) ---
function toLocalDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
document.querySelectorAll('button[data-quick]').forEach(btn => {
  btn.addEventListener('click', () => {
    const q = btn.dataset.quick;
    const now = new Date();
    let fromStr = '', toStr = '';
    if (q === 'today') {
      const s = toLocalDateStr(now);
      fromStr = s; toStr = s;
    } else if (q === 'week') {
      // 月曜始まり: getDay()=0=日, 1=月, ... → 月曜まで戻すオフセット
      const dow = now.getDay();
      const offset = (dow === 0) ? 6 : (dow - 1);
      const start = new Date(now);
      start.setDate(start.getDate() - offset);
      fromStr = toLocalDateStr(start);
      toStr = toLocalDateStr(now);
    } else if (q === 'month') {
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      fromStr = toLocalDateStr(start);
      toStr = toLocalDateStr(now);
    }
    // q === 'all' のときは空のまま
    filters.dateFrom = fromStr;
    filters.dateTo = toStr;
    document.getElementById('date-from').value = fromStr;
    document.getElementById('date-to').value = toStr;
    renderTable();
  });
});

// --- モードトグルのイベント (body class + 全再描画) ---
function applyBodyMode() {
  document.body.className = 'mode-' + currentMode;
}
document.querySelectorAll('.mode-toggle button[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyBodyMode();
    renderSummaryCards();
    drawEquityChart();
    drawPipsChart();  // 累積pipsもテーマ切替
    renderTable();
  });
});

// --- 初期描画 ---
renderSummaryCards();
drawEquityChart();
drawPipsChart();
updateSortArrows();
renderTable();
</script>

</div><!-- /#app -->

<script>
const LOGIN_ID = 'pudgy';
const LOGIN_PW = '0616';

function showApp() {
  // app は常に visible (Plotly が正しい width で描画されるため)
  // login-screen を非表示にするだけ
  document.getElementById('login-screen').style.display = 'none';
}
function showLogin() {
  // login-screen を表示 (z-index:9999 で app を覆い隠す)
  document.getElementById('login-screen').style.display = '';
}
function doLogout() {
  localStorage.removeItem('pb_logged_in');
  location.reload();
}

// 認証チェック (DOMContentLoaded より早く実行)
(function() {
  if (localStorage.getItem('pb_logged_in') === '1') {
    showApp();
  } else {
    showLogin();
  }
})();

document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('login-form');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('login-id').value;
      const pw = document.getElementById('login-pw').value;
      if (id === LOGIN_ID && pw === LOGIN_PW) {
        localStorage.setItem('pb_logged_in', '1');
        location.reload();
      } else {
        document.getElementById('login-error').textContent = 'IDまたはパスワードが正しくありません';
      }
    });
  }
});
</script>
